<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lights Out Live Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: one calm column. A live "now" strip on top, seats as a row of names, then a timeline checklist. No card grid. */
:root{
  --bg:#F5F7FA; --fg:#14213D; --muted:#5B6578; --line:#D5DBE6; --soft:#E9EDF4;
  --accent:#0B6E78; --accent-fg:#FFFFFF; --now:#B45309; --now-soft:#FBEBD3; --done:#0B6E78;
  --c-lead:#1D4ED8; --c-tech:#0B6E78; --c-exec:#7C3AED; --c-legal:#B45309; --c-fin:#BE185D; --c-comms:#4D7C0F;
  --font-head:"Space Grotesk","Segoe UI",system-ui,sans-serif; --font-body:"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --fg:#E7ECF5; --muted:#9AA6BD; --line:#2A3550; --soft:#18223A;
  --accent:#4FC3CF; --accent-fg:#06222A; --now:#F3A74D; --now-soft:#2E2314; --done:#4FC3CF;
  --c-lead:#7AA2FF; --c-tech:#4FC3CF; --c-exec:#B79BFF; --c-legal:#F3A74D; --c-fin:#F58AB6; --c-comms:#A5D26A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --fg:#E7ECF5; --muted:#9AA6BD; --line:#2A3550; --soft:#18223A;
  --accent:#4FC3CF; --accent-fg:#06222A; --now:#F3A74D; --now-soft:#2E2314; --done:#4FC3CF;
  --c-lead:#7AA2FF; --c-tech:#4FC3CF; --c-exec:#B79BFF; --c-legal:#F3A74D; --c-fin:#F58AB6; --c-comms:#A5D26A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0;
  padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance;letter-spacing:-0.01em}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.step:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.top h1{font-size:30px;line-height:1.15}
.sync{font-size:12px;color:var(--muted)}
.banner{font-size:13px;color:var(--now);background:var(--now-soft);padding:8px 12px;border-radius:6px}

/* now strip */
.now{border-left:4px solid var(--now);padding:2px 0 2px 18px;display:flex;flex-direction:column;gap:12px}
.now .meta{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.now .tag{font-weight:600;color:var(--now);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.now .clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.now h2{font-size:24px;line-height:1.3;font-weight:500}
.asks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.asks li{display:flex;gap:10px;align-items:baseline}
.asks b{white-space:nowrap}
.ctl{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.btn{border:1px solid var(--line);background:transparent;padding:7px 14px;border-radius:999px;font-size:13px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:default}

/* progress */
.prog{display:flex;flex-direction:column;gap:10px}
.prog .row{display:flex;justify-content:space-between;align-items:baseline}
.prog .count{font-family:var(--font-head);font-size:20px;font-variant-numeric:tabular-nums}
.track{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.track i{height:8px;border-radius:4px;background:var(--soft)}
.track i.on{background:var(--done)}

/* seats */
.seats{display:flex;flex-wrap:wrap;gap:10px 22px}
.seat{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 0;text-align:left}
.seat .dot{width:10px;height:10px;border-radius:50%;flex:none}
.seat .nm{font-weight:600}
.seat .who{color:var(--muted);font-size:13px}
.seat.mine .nm{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.seat .act{font-size:12px;color:var(--accent);margin-left:2px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.sec-h h2{font-size:20px}
.tabs{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:999px}
.tabs button{border:0;background:none;padding:5px 14px;border-radius:999px;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--bg);font-weight:600;box-shadow:0 0 0 1px var(--line)}

/* timeline */
.round{margin-bottom:26px}
.round h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;gap:10px;align-items:baseline}
.round h3 em{font-style:normal;font-weight:400;letter-spacing:0;text-transform:none;font-size:13px}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;background:var(--line)}
.step{position:relative;display:grid;grid-template-columns:24px 1fr;gap:14px;padding:9px 0;cursor:pointer;border-radius:6px}
.step .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;z-index:1;color:transparent;font-size:13px;font-weight:700}
.step.done .chk{background:var(--done);border-color:var(--done);color:var(--accent-fg)}
.step .body{display:flex;flex-direction:column;gap:3px;min-width:0}
.step .tx{font-weight:500}
.step.done .tx{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.step .sub{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.step .own{display:inline-flex;align-items:center;gap:5px}
.step .own .dot{width:8px;height:8px;border-radius:50%}
.step.mine .tx{font-weight:700}
.step.mine .chk{border-color:var(--accent)}
.step.faded{opacity:.55}
.pill{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line)}
.pill.added{border-color:var(--now);color:var(--now)}
.pill.target{border-color:var(--accent);color:var(--accent)}
.doneby{color:var(--done);font-weight:500}

/* my seat */
.role{display:flex;flex-direction:column;gap:20px}
.role .lead{font-size:17px;margin:0}
.role h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.role ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.role .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.empty{color:var(--muted)}
.step .chk{padding:0;cursor:pointer;font-family:inherit}
.step{cursor:default}
.step .tx{cursor:pointer}
.more{border:0;background:none;padding:0;font-size:12.5px;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.note{font-size:13.5px;color:var(--fg);background:var(--soft);padding:6px 10px;border-radius:6px;margin-top:2px;white-space:pre-wrap}
.edit{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.edit textarea,.add input,.add select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%}
.edit textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:3px 11px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--now-soft);border-color:var(--now);color:var(--now);font-weight:600}
.pill.delay{border-color:var(--now);color:var(--now)}
.maintabs{display:flex;gap:4px;background:var(--soft);padding:3px;border-radius:999px;align-self:flex-start}
.maintabs button{border:0;background:none;padding:6px 18px;border-radius:999px;font-size:14px}
.maintabs button[aria-pressed="true"]{background:var(--bg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.tl{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:6px 18px;align-items:center}
.tl .lab{font-size:14px}
.tl .bar{position:relative;height:22px}
.tl .bar::before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:var(--line)}
.tl .tg{position:absolute;top:3px;width:2px;height:16px;background:var(--muted)}
.tl .ac{position:absolute;top:4px;width:14px;height:14px;border-radius:50%;margin-left:-7px;background:var(--done)}
.tl .ac.late{background:var(--now)}
.tl .res{grid-column:1/-1;font-size:12.5px;color:var(--muted);margin:-2px 0 8px}
.axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tally{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 28px;gap:6px 14px;align-items:center;font-size:14px}
.tally .b{height:8px;border-radius:4px;background:var(--soft);position:relative}
.tally .b i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--now)}
.fix{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line)}
.fix .xx{margin-left:auto}
.add{display:grid;grid-template-columns:minmax(0,1fr) 190px auto;gap:8px;margin-bottom:12px}
@media (max-width:620px){.tl{grid-template-columns:1fr}.add{grid-template-columns:1fr}}
.foot{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:520px){.top h1{font-size:25px}.now h2{font-size:20px}}
@media (prefers-reduced-motion:no-preference){.track i,.step .chk{transition:background .25s,border-color .25s}}
</style>

</head><body>
<div class="wrap" id="app"></div>

<script>
(function(){
var SEATS=[
 {id:'lead',n:'Crisis Lead',who:'Chief Technology and AI Officer',c:'--c-lead',
  lead:'You run the room and own the clock.',
  dec:['Declare a crisis: IR level and Tier 1 (minute 3)','Which actions need no approval','What the executive call says (minute 15)'],
  act:['Min 0\u20133: say the level and Tier aloud; name one commander','Min 10\u201315: call the executives by phone','Round 3: set the daily update cadence'],
  pass:['To Tech and Security: scope and containment','To Legal and Communications: one approved message']},
 {id:'tech',n:'Tech and Security',who:'vCISO, IT Security Operations',c:'--c-tech',
  lead:'You contain it.',
  dec:['Who is the one Incident Commander','What to isolate; what was copied','Who to call in: forensics, insurer'],
  act:['Min 0\u20135: lock CEO accounts, reset MFA, revoke tokens','Min 5\u201310: isolate the laptop; no attacker contact','Round 2: report what the attacker could have copied'],
  pass:['To Crisis Lead: scope and containment','To Legal: forensics, insurer, evidence']},
 {id:'exec',n:'Executive Office',who:'CEO or CFO',c:'--c-exec',
  lead:'You approve, and your devices are the way in.',
  dec:['Hand over devices and accounts at once','Final approval on statements and the plan','Board notice, with Legal (added)'],
  act:['Min 0: hand over your devices; take the call by min 15','Round 2: tell the room what the files contain','Round 3: approve the statement and Board notice'],
  pass:['To Crisis Lead: direction','To Legal: Board and disclosure']},
 {id:'legal',n:'Legal',who:'General Counsel, Assistant GC',c:'--c-legal',
  lead:'You approve what is said.',
  dec:['Approve what is said, inside and out','Is the exposure material (added)','Trading blackout and Board notice (added)'],
  act:['Min 5\u201310: join; engage Latham and Hunton; no attacker contact','Min 15\u201320: approve the holding line','Rounds 2\u20133: materiality, blackout, statements, sanctions check'],
  pass:['To Communications: approved wording','To Finance and IR: disclosure view']},
 {id:'fin',n:'Finance and IR',who:'Controller; VP, Corp Development and IR',c:'--c-fin',
  lead:'You judge what the Street would see.',
  dec:['What the exposed numbers mean (added)','Does it meet the bar for SEC disclosure','What IR tells analysts (added)'],
  act:['Min 0\u201320: listen in; note the Street as a stakeholder','Round 2: size the exposure with Legal; Controller joins','Round 3: prepare the investor line; no selective sharing'],
  pass:['To Legal: disclosure view','To Communications: analyst wording']},
 {id:'comms',n:'Communications',who:'VP, Corporate Communications',c:'--c-comms',
  lead:'You write the words and keep one voice.',
  dec:['What the statements say','Which channel carries each message','When to call Joele Frank'],
  act:['Min 5\u201310: join; list who must hear','Min 10\u201320: draft the holding line; send to Legal','Round 3: one message to staff, media and partners'],
  pass:['To Legal: drafts for approval','To Finance and IR: analyst wording']}
];
var SEAT={};SEATS.forEach(function(s){SEAT[s.id]=s});
var ROUNDS=[{r:1,t:'Round 1',sub:'Speed round: first response in 20 minutes'},{r:2,t:'Round 2',sub:'What got out'},{r:3,t:'Round 3',sub:'Tell people'}];
var STEPS=[
 {id:'s1',r:1,t:'Crisis declared: level and Tier said aloud, one Incident Commander named',o:['lead'],g:'by min 3',m:3},
 {id:'s2',r:1,t:'CEO accounts locked, MFA reset, tokens revoked, forwarding rules removed',o:['tech'],g:'by min 5',m:5},
 {id:'s3',r:1,t:'Company laptop isolated, credentials disabled',o:['tech'],g:'by min 10',m:10},
 {id:'s4',r:1,t:'Legal and forensics engaged; no contact with the attacker',o:['legal','tech'],g:'by min 10',m:10},
 {id:'s5',r:1,t:'Executives told, by phone',o:['lead','exec'],g:'by min 15',m:15},
 {id:'s6',r:1,t:'Holding line for media and analysts approved by Legal',o:['comms','legal'],g:'by min 20',m:20},
 {id:'s7',r:2,t:'Exposure assessed: what was taken, could it move earnings',o:['fin','exec'],a:1},
 {id:'s8',r:2,t:'Materiality decided and the reasoning written down',o:['legal','fin'],a:1},
 {id:'s9',r:2,t:'Trading blackout started for people who know',o:['legal'],a:1},
 {id:'s10',r:3,t:'Full statements approved by Legal; one voice for staff, media and analysts',o:['legal','comms']},
 {id:'s11',r:3,t:'Disclosure path and Board notice agreed',o:['exec','legal'],a:1},
 {id:'s12',r:3,t:'Daily update set; sanctions check before any ransom talk',o:['lead','legal'],a:1}
];
var INJ=[null,
 {r:1,tag:'Inject 1 of 4  \u00b7  minute 0',tx:'Monday morning. The CEO\u2019s personal email shows sign-ins from another country, and the phone is acting strange.',
  ask:[['lead','Level and tier? Who is in charge?'],['tech','What do you do first?']],
  fac:'Say: the clock is running. Move to Inject 2 at minute 5.'},
 {r:1,tag:'Inject 2 of 4  \u00b7  minute 5',tx:'The CEO\u2019s work laptop now shows a ransom note, and files are leaving the network.',
  ask:[['tech','Isolate it. Who is in charge?'],['exec','Hand over your devices.'],['legal','Join. Who do you call?'],['lead','When do executives get told?']],
  fac:'Red cell: if accounts are not locked by minute 10, the attacker takes the CFO account too. Stop the clock at minute 20 and read out the times.'},
 {r:2,tag:'Inject 3 of 4',tx:'The attacker emails samples of unreleased results. They say: 24 hours, then it goes to analysts and the press.',
  ask:[['exec','What is in those files?'],['fin','Could this move earnings?'],['legal','Is it material? Does a trading blackout start?']]},
 {r:3,tag:'Inject 4 of 4',tx:'A reporter asks Communications about leaked earnings.',
  ask:[['legal','Who hears first, and what do we say?'],['comms','Draft the line.'],['exec','Does the Board hear before the reporter does?'],['legal','Run a sanctions check before any ransom talk.']]}
];
var HOT=['Where did the minutes go?','What would you pre-approve or automate to cut it to 5?','What would you change in the Playbook?'];

var app=document.getElementById('app');
var db=null,user=null,me=null,admin=false,names={},view='all',mySeatPref=null,resetArm=false,online=false,syncNote='Connecting…';
var S={inject:0,injectAt:0,startedAt:0},steps={},seats={},fixes={},decs={},dtEnd=0,main='live',openStep=null,pending=false,dl=null;
var DEFAULTS={
 lead:'Declare the crisis at the highest level unless the facts clearly say otherwise.',
 tech:'Lock accounts and isolate the laptop now, unless Legal says it would destroy evidence.',
 exec:'Do not pay or contact the attacker unless the Board and Legal decide otherwise.',
 legal:'Treat leaked earnings as material nonpublic information and start the trading blackout, unless Finance shows it is not.',
 fin:'Assume the leaked numbers are real, unless Finance proves otherwise.',
 comms:'Send the approved holding line when asked, unless Legal stops it.'};
var RULES=['One owner per decision. Others advise, then accept the call.','Three minutes. After that the owner decides. If the owner is stuck, the Crisis Lead decides.','Say whether it is reversible or hard to undo. Hard to undo (paying, public statements, filings) needs Legal to clear it.','If the CEO is compromised, the General Counsel and CFO approve in the CEO\u2019s place.'];
var DELAYS=['Waiting for approval','Unclear who owned it','Someone was not told','Duplicated work','Missing information'];

function h(tag,attrs,kids){var e=document.createElement(tag);
  if(attrs)for(var k in attrs){if(k==='class')e.className=attrs[k];else if(k==='text')e.textContent=attrs[k];else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),attrs[k]);else if(attrs[k]!==false&&attrs[k]!=null)e.setAttribute(k,attrs[k]);}
  (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c)});return e}
function dot(id){var d=h('span',{class:'dot'});d.style.background='var('+SEAT[id].c+')';return d}
function nameOf(uid){if(!uid)return '';if(uid===me)return 'you';return names[uid]||'Someone'}
function mySeat(){for(var k in seats){if(seats[k]&&seats[k].uid===me&&me)return k}return null}
function clock(ms){var d=new Date(ms);return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}
function mmss(ms){var s=Math.max(0,Math.floor(ms/1000));var m=Math.floor(s/60);s=s%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}

/* writes: shared store when signed in, local memory otherwise */
function guard(p){return p&&p.catch?p.catch(function(){syncNote='A change did not save. Check that you have Contributor access.';render()}):p}
function setInject(n){
  var st=S.startedAt||Date.now();var v={inject:n,injectAt:Date.now(),startedAt:n===0?0:st};
  resetArm=false;
  if(db){guard(db.doc('session/state').set(v))}else{S=v;render()}}
function toggleStep(id){
  var c=steps[id]||{};var v=Object.assign({},c,{done:!c.done,uid:me||'',at:Date.now()});
  if(db){guard(db.doc('steps/'+id).set(v))}else{steps[id]=v;render()}}
function saveMeta(id,patch){
  var c=steps[id]||{};var v=Object.assign({},c,patch);
  if(db){guard(db.doc('steps/'+id).set(v))}else{steps[id]=v;render()}}
function addFix(text,seat){
  text=(text||'').trim();if(!text)return;
  var id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);var v={text:text.slice(0,400),seat:seat||'',uid:me||'',at:Date.now()};
  if(db){guard(db.doc('fixes/'+id).set(v))}else{fixes[id]=v;render()}}
function addDec(text,seat,kind){
  text=(text||'').trim();if(!text)return;
  var id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);var v={text:text.slice(0,300),seat:seat||'',kind:kind==='hard'?'hard':'rev',uid:me||'',at:Date.now()};
  if(db){guard(db.doc('decisions/'+id).set(v))}else{decs[id]=v;render()}}
function delDec(id){if(db){guard(db.doc('decisions/'+id).delete())}else{delete decs[id];render()}}
function delFix(id){if(db){guard(db.doc('fixes/'+id).delete())}else{delete fixes[id];render()}}
function claim(id){
  var old=mySeat();
  if(db){
    var p=Promise.resolve();
    if(old&&old!==id)p=db.doc('seats/'+old).delete();
    p.then(function(){return db.doc('seats/'+id).set({uid:me,at:Date.now()})}).catch(function(){syncNote='Could not take the seat. Check that you have Contributor access.';render()});
  }else{if(old)delete seats[old];seats[id]={uid:'local',at:Date.now()};me='local';render()}}
function release(id){if(db){guard(db.doc('seats/'+id).delete())}else{delete seats[id];render()}}
function resetAll(){
  if(!resetArm){resetArm=true;render();return}
  resetArm=false;
  if(db){var ps=STEPS.map(function(s){return db.doc('steps/'+s.id).delete()}).concat(SEATS.map(function(s){return db.doc('seats/'+s.id).delete()})).concat(Object.keys(fixes).map(function(k){return db.doc('fixes/'+k).delete()})).concat(Object.keys(decs).map(function(k){return db.doc('decisions/'+k).delete()}));
    Promise.all(ps).then(function(){return db.doc('session/state').set({inject:0,injectAt:0,startedAt:0})}).catch(function(){syncNote='Reset failed. Only an Editor can reset.';render()})}
  else{S={inject:0,injectAt:0,startedAt:0};steps={};seats={};fixes={};decs={};render()}}

/* views */
function nowStrip(){
  var i=S.inject,box=h('section',{class:'now','aria-live':'polite'});
  var meta=h('div',{class:'meta'});
  var timer=h('span',{class:'clock',id:'tmr'});var r1=h('span',{class:'clock',id:'r1'});
  var body;
  if(i===0){
    meta.appendChild(h('span',{class:'tag',text:'Waiting to start'}));
    body=h('h2',{text:'Take your seat below. The facilitator starts the first inject.'});
  }else if(i<=4){
    var I=INJ[i];meta.appendChild(h('span',{class:'tag',text:I.tag+'  ·  Round '+I.r}));meta.appendChild(timer);if(i<=2)meta.appendChild(r1);
    body=h('div',{},[h('h2',{text:I.tx}),
      h('ul',{class:'asks'},I.ask.map(function(a){return h('li',{},[dot(a[0]),h('span',{},[h('b',{text:SEAT[a[0]].n+': '}),a[1]])])}))]);

      if(changed)LIS.slice().forEach(fire);
      else if(!online){online=true;render()}
    })
    .catch(function(){fails++;if(fails>=2&&online){online=false;syncNote='Reconnecting…';render()}})
    .then(function(){polling=false;
      if(again){again=false;poll();return}
      pollTimer=setTimeout(poll,document.hidden?15000:2000)})}
function pollSoon(){if(polling)again=true;else{clearTimeout(pollTimer);pollTimer=setTimeout(poll,50)}}
document.addEventListener('visibilitychange',function(){if(!document.hidden)pollSoon()});

function joinForm(msg){
  app.textContent='';
  var nm=h('input',{id:'j-name',type:'text',maxlength:'60',placeholder:'Your name','aria-label':'Your name'});nm.value=NAME;
  var cd=h('input',{id:'j-code',type:'text',maxlength:'12',placeholder:'Join code','aria-label':'Join code'});cd.value=CODE;
  var go=function(){var n=nm.value.trim(),c=cd.value.trim().toUpperCase();if(!n||!c){joinForm('Enter your name and the join code.');return}NAME=n;CODE=c;connect(true)};
  var f=h('form',{class:'edit',style:'max-width:380px;gap:12px',onsubmit:function(e){e.preventDefault();go()}},[
    h('label',{for:'j-name',class:'eyebrow',text:'Your name'}),nm,h('label',{for:'j-code',class:'eyebrow',text:'Join code'}),cd,
    msg?h('div',{class:'banner',text:msg}):null,h('button',{class:'btn pri',type:'submit',text:'Join the exercise'})]);
  app.appendChild(h('div',{class:'eyebrow',style:'color:var(--now);font-weight:700',text:'Privileged and confidential  ·  Do not forward  ·  Fictional exercise'}));
  app.appendChild(h('header',{class:'top'},[h('div',{},[h('div',{class:'eyebrow',text:'Operation Lights Out  ·  live board'}),h('h1',{text:'Ransomware and the Street'})])]));
  app.appendChild(f)}
function connect(fromForm){
  api('join',{name:NAME}).then(function(j){
    store('lo-name',NAME);store('lo-code',CODE);if(ADMIN&&j.admin)store('lo-admin',ADMIN);
    admin=!!j.admin;start()
  }).catch(function(e){joinForm(fromForm||CODE?'That join code was not accepted. Check it and try again.':'')})}
var started=false;
function start(){
  if(started)return;started=true;
  user=USER;me=UID;db=DB;dl=DL;
  render();
  db.doc('session/state').onSnapshot(function(snap){
    var v=snap.exists?snap.data():null;S=v&&typeof v.inject==='number'?v:{inject:0,injectAt:0,startedAt:0};online=true;render()});
  snapColl('steps');snapColl('seats');snapColl('fixes');snapColl('decisions');
  poll()}
if(NAME&&CODE)connect(false);else joinForm('');
})();
</script>
